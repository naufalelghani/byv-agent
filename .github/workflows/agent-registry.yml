name: Agent Registry

on:
  pull_request:
    paths:
      - "agents/**"
      - "scripts/**"
      - "tests/**"
      - "docs/agent-registry-bootstrap.md"
      - "docs/agent-registry-delegation.md"
      - "docs/agent-registry-messaging.md"
      - "docs/agent-registry-dynamic.md"
      - "docs/p5-runtime-orchestration.md"
      - "docs/p5-api-first-configuration.md"
      - "config/**"
      - "commands/autonomous.md"
      - "task/ROADMAP.md"
      - ".github/workflows/agent-registry.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "agents/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "docs/agent-registry-bootstrap.md"
      - "docs/agent-registry-delegation.md"
      - "docs/agent-registry-messaging.md"
      - "commands/autonomous.md"
      - "task/ROADMAP.md"
      - ".github/workflows/agent-registry.yml"

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate agent registry and runtime mappings
        run: node scripts/validate-agent-registry.mjs
      - name: Validate provider profile metadata
        run: node scripts/validate-provider-profiles.mjs
      - name: Run agent registry, bootstrap, delegation, messaging, runtime, and provider tests
        run: node --test tests/agent-registry.test.mjs tests/agent-bootstrap.test.mjs tests/delegation-validation.test.mjs tests/agent-message.test.mjs tests/registry-runtime.test.mjs tests/provider-runtime.test.mjs
